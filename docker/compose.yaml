name: php-python-ai-bridge

x-limits: &limits
  platform: linux/amd64
  user: "65532:65532"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1
  working_dir: /work
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
  volumes:
    - ..:/work:ro

x-python: &python
  <<: *limits
  image: python:3.12-bookworm@sha256:581429e3df12d76e6af4be5ab7d0e7fc2013eb57dc23d2de691411c8efdbb970
  environment: &python-env
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /work/worker
    BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Set BRIDGE_TOKEN to a random service token of at least 32 characters}

# Dependants wait for /readyz (a child idle with its models loaded); the token comes from the container's environment.
x-worker-health: &worker-health
  test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8090/readyz', headers={'Authorization': 'Bearer ' + os.environ['BRIDGE_TOKEN']}), timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 60
  start_period: 10s
  start_interval: 1s

x-php: &php
  <<: *limits
  image: ${BRIDGE_PHP_IMAGE:-dunglas/frankenphp:1.12.7-php8.5-bookworm@sha256:7380f2c24ef9d86ad496dbc285ba66e212365c864db2797f3e7269afad100dbb}
  entrypoint: []
  environment: &php-env
    BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Set BRIDGE_TOKEN}
    BRIDGE_URL: http://worker:8090
    XDG_CONFIG_HOME: /tmp/config
    XDG_DATA_HOME: /tmp/data

services:
  # The job table goes to disk here so the integration tests exercise that path; tmpfs keeps it off the host.
  worker:
    <<: *python
    environment:
      <<: *python-env
      BRIDGE_STATE_DIR: /state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /state:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=0700
    networks: [isolated]
    command: [python, -m, ai_bridge.server, --host, 0.0.0.0]

  frankenphp:
    <<: *php
    entrypoint: [sh, /work/scripts/run_frankenphp.sh]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /runtime:rw,exec,nosuid,size=256m,uid=65532,gid=65532
    networks: [isolated]
    depends_on: [worker]
    command: [run, --config, /work/examples/frankenphp/Caddyfile, --adapter, caddyfile]

  # TLS in front of the worker for a client on another host; it holds no token, and its CA is on the tls-ca volume.
  tls-proxy:
    <<: *php
    profiles: [tls]
    entrypoint: [sh, /work/scripts/run_frankenphp.sh]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /runtime:rw,exec,nosuid,size=256m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - tls-ca:/data
    networks: [isolated]
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /data
    command: [run, --config, /work/examples/tls/Caddyfile, --adapter, caddyfile]

  python-tests:
    <<: *python
    profiles: [test]
    network_mode: none
    command: [python, -m, unittest, discover, -s, tests/python, -v]

  php-tests:
    <<: *php
    profiles: [test]
    network_mode: none
    command: [php, tests/php/run.php]

  # The consumer-install check: a throwaway consumer project in tmpfs installs the git archive of HEAD (or a path
  # repository in a git worktree whose gitdir is outside the mount) with Packagist disabled, offline.
  composer-install:
    <<: *limits
    image: composer:2@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
    profiles: [test]
    network_mode: none
    entrypoint: []
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_NO_INTERACTION: "1"
      BRIDGE_REQUIRE_ARCHIVE: ${BRIDGE_REQUIRE_ARCHIVE:-}
      # Composer reads the library's version from git, which refuses a checkout another uid owns.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
    command:
      - sh
      - -ec
      - |
        composer validate --strict
        mkdir -p /tmp/consumer
        cp /work/tests/php/consumer/composer.json /tmp/consumer/
        if [ -d /work/.git ]; then
          mkdir -p /tmp/archive
          git archive --format=zip HEAD > /tmp/archive/bridge.zip
          # The artifact repository needs a version in composer.json; it is not the release.
          php -r '$$z = new ZipArchive(); if ($$z->open("/tmp/archive/bridge.zip") !== true) exit(1); $$c = json_decode((string) $$z->getFromName("composer.json"), true, 512, JSON_THROW_ON_ERROR); $$c["version"] = "0.0.0"; $$z->addFromString("composer.json", json_encode($$c)); if (!$$z->close()) exit(1);'
        elif [ -f /work/.git ]; then
          if [ -n "$$BRIDGE_REQUIRE_ARCHIVE" ]; then
            echo "consumer install: archive required (BRIDGE_REQUIRE_ARCHIVE is set), but /work/.git is a worktree file" >&2
            exit 1
          fi
          # Replace the artifact repository entry in place with a path repository when the worktree's gitdir is outside the mount.
          composer config --working-dir=/tmp/consumer repositories.0 '{"type": "path", "url": "/work", "options": {"symlink": true}}'
        else
          echo "/work/.git is neither a directory nor a worktree file" >&2
          exit 1
        fi
        cd /tmp/consumer
        composer install --no-interaction
        php /work/tests/php/consumer/check.php

  # The dev packages from composer.lock (PHPStan, the PSR interfaces) into .cache, the only PHP step with network;
  # php-analysis and php-psr18-tests then use them offline.
  php-fetcher:
    <<: *limits
    image: composer:2@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
    profiles: [php-dev]
    network_mode: bridge
    entrypoint: []
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_VENDOR_DIR: /cache/php-vendor
      COMPOSER_NO_INTERACTION: "1"
    command: [composer, install, --no-interaction, --prefer-dist, --no-scripts, --no-plugins]

  php-analysis:
    <<: *limits
    image: composer:2@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
    profiles: [php-dev]
    network_mode: none
    entrypoint: []
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
    command: [php, /cache/php-vendor/bin/phpstan, analyse, --no-progress, --memory-limit=512M, -c, phpstan.neon]

  # The contract checks again with php-fetcher's vendor directory on the include path, so the PSR-18 ones run too.
  php-psr18-tests:
    <<: *php
    profiles: [php-dev]
    network_mode: none
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
    command: [php, -d, include_path=/cache/php-vendor, tests/php/run.php]

  # The frameworks tests/php/frameworks/composer.lock pins, with the library linked from /work as Composer would install
  # it, into .cache: the only framework step with network. php-analysis and the framework tests then use them offline.
  php-frameworks-fetcher:
    <<: *limits
    image: composer:2@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
    profiles: [php-frameworks]
    network_mode: bridge
    entrypoint: []
    working_dir: /work/tests/php/frameworks
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_VENDOR_DIR: /cache/php-frameworks-vendor
      COMPOSER_NO_INTERACTION: "1"
    command: [composer, install, --no-interaction, --prefer-dist, --no-scripts, --no-plugins]

  # A Laravel application and a Symfony kernel booted around the library's provider and bundle, against the real worker.
  laravel-tests: &framework-tests
    <<: *php
    profiles: [php-frameworks]
    networks: [isolated]
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
    environment:
      <<: *php-env
      COMPOSER_VENDOR_DIR: /cache/php-frameworks-vendor
    command: [php, tests/php/frameworks/laravel.php]

  symfony-tests:
    <<: *framework-tests
    command: [php, tests/php/frameworks/symfony.php]

  # The system CA store is emptied so the trusted run can pass only through the example root.
  tls-check:
    <<: *php
    profiles: [tls]
    networks: [isolated]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /etc/ssl/certs:ro,noexec,nosuid,size=1m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - tls-ca:/ca:ro
    environment:
      <<: *php-env
      BRIDGE_TLS_URL: https://tls-proxy:8443
      BRIDGE_TLS_CA: /ca/caddy/pki/authorities/local/root.crt
    command:
      - sh
      - -ec
      - |
        php -d curl.cainfo="$$BRIDGE_TLS_CA" -d openssl.cafile="$$BRIDGE_TLS_CA" tests/php/tls.php trusted
        php tests/php/tls.php untrusted

  integration:
    <<: *python
    profiles: [test]
    networks: [isolated]
    environment:
      <<: *python-env
      FRANKENPHP_URL: http://frankenphp:8080
      WORKER_URL: http://worker:8090
      TOKENS_WORKER_URL: http://tokens-worker:8090
      BRIDGE_APP_TOKEN: test-only-app-client-token-never-use-in-production
      BRIDGE_OTHER_TOKEN: test-only-other-client-token-never-use-in-production
    command: [python, tests/integration.py]

  php-example:
    <<: *php
    profiles: [example]
    networks: [isolated]
    command: [php, examples/rerank.php]

  fault-worker:
    <<: *python
    profiles: [test]
    networks: [isolated]
    environment:
      <<: *python-env
      BRIDGE_TEST_TASKS: "1"
      BRIDGE_CONCURRENCY: "1"
    command: [python, -m, ai_bridge.server, --host, 0.0.0.0]

  # Two clients of one worker, each with its own test-only literal token, independent of the run's BRIDGE_TOKEN.
  # The environment is written out rather than merged, since BRIDGE_TOKEN beside BRIDGE_TOKENS is a start error.
  tokens-worker:
    <<: *python
    profiles: [test]
    networks: [isolated]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /work/worker
      BRIDGE_TOKENS: app=test-only-app-client-token-never-use-in-production,other=test-only-other-client-token-never-use-in-production
    command: [python, -m, ai_bridge.server, --host, 0.0.0.0]

  hostile:
    <<: *python
    profiles: [test]
    networks: [isolated]
    command: [python, tests/hostile_server.py]

  php-integration:
    <<: *php
    profiles: [test]
    networks: [isolated]
    environment:
      <<: *php-env
      BRIDGE_TOKENS_URL: http://tokens-worker:8090
      BRIDGE_APP_TOKEN: test-only-app-client-token-never-use-in-production
      BRIDGE_OTHER_TOKEN: test-only-other-client-token-never-use-in-production
    command: [php, tests/php/integration.php]

  fetcher:
    <<: *python
    profiles: [model-fetch]
    network_mode: bridge
    mem_limit: 512m
    volumes:
      - ..:/work:ro
      - ../.cache:/cache
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    command:
      - sh
      - -ec
      - 'python -m pip download --require-hashes --only-binary=:all: --dest /cache/wheels -r requirements-model.lock && python scripts/fetch_model.py'

  model-worker: &model-worker
    <<: *python
    profiles: [model]
    mem_limit: 1536m
    networks: [isolated]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=65532,gid=65532
      - /deps:rw,exec,nosuid,size=512m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
    environment: &model-worker-env
      <<: *python-env
      PYTHONPATH: /work/worker:/deps
      BRIDGE_BACKEND: onnx
      BRIDGE_MODEL_DIR: /cache/models
      BRIDGE_CONCURRENCY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    command:
      - sh
      - -ec
      - 'python -m pip install --require-hashes --no-compile --no-index --find-links=/cache/wheels --only-binary=:all: --target /deps -r requirements-model.lock && exec python -m ai_bridge.server --host 0.0.0.0'

  model-test:
    <<: *php
    profiles: [model]
    networks: [isolated]
    environment:
      <<: *php-env
      BRIDGE_URL: http://model-worker:8090
    command: [php, tests/php/model.php]

  model-frankenphp:
    <<: *php
    profiles: [model]
    entrypoint: [sh, /work/scripts/run_frankenphp.sh]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /runtime:rw,exec,nosuid,size=256m,uid=65532,gid=65532
    networks: [isolated]
    depends_on: [model-worker]
    environment:
      <<: *php-env
      BRIDGE_URL: http://model-worker:8090
    command: [run, --config, /work/examples/frankenphp/Caddyfile, --adapter, caddyfile]

  model-integration:
    <<: *python
    profiles: [model]
    networks: [isolated]
    environment:
      <<: *python-env
      FRANKENPHP_URL: http://model-frankenphp:8080
    command: [python, tests/model_integration.py]

  # Informational job latency for docs/testing.md, one cold first job then warm ones; asserts correctness, never speed.
  model-bench:
    <<: *python
    profiles: [model]
    networks: [isolated]
    environment:
      <<: *python-env
      BENCH_TARGETS: onnx=http://model-worker:8090,lexical=http://worker:8090
      BENCH_RUNS: "5"
      BENCH_ORDER: ${BENCH_ORDER:-}
      BENCH_COMMIT: ${BENCH_COMMIT:-unknown}
      BENCH_RUNNER: ${BENCH_RUNNER:-local, unspecified}
    command: [python, scripts/benchmark.py]

  # Informational NER precision and recall on tests/fixtures/ner-sample.json, against model-worker.
  model-ner:
    <<: *python
    profiles: [model]
    networks: [isolated]
    environment:
      <<: *python-env
      NER_TARGET: http://model-worker:8090
      NER_SAMPLE: ${NER_SAMPLE:-}
      BENCH_COMMIT: ${BENCH_COMMIT:-unknown}
      BENCH_RUNNER: ${BENCH_RUNNER:-local, unspecified}
    command: [python, scripts/ner_measure.py]

  # Informational throughput and latency under concurrent load, against model-worker or, with LOAD_TARGET=lexical, worker.
  model-load:
    <<: *python
    profiles: [model]
    networks: [isolated]
    environment:
      <<: *python-env
      LOAD_TARGET: ${LOAD_TARGET:-onnx}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-1,4}
      LOAD_SECONDS: ${LOAD_SECONDS:-120}
      LOAD_CASE: ${LOAD_CASE:-mix}
      LOAD_SETTLE_SECONDS: ${LOAD_SETTLE_SECONDS:-300}
      BENCH_COMMIT: ${BENCH_COMMIT:-unknown}
      BENCH_RUNNER: ${BENCH_RUNNER:-local, unspecified}
    command: [python, scripts/load_measure.py]

  mcp-fetcher:
    <<: *python
    profiles: [mcp-fetch]
    network_mode: bridge
    volumes:
      - ..:/work:ro
      - ../.cache:/cache
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    command:
      - sh
      - -ec
      - 'python -m pip download --require-hashes --only-binary=:all: --dest /cache/wheels -r requirements-mcp.lock'

  # The MCP server's own worker. An agent can be prompt-injected into filling a worker's capacity, so the
  # MCP server never shares one with an application or with the FrankenPHP demo.
  mcp-worker:
    <<: *python
    profiles: [mcp]
    networks: [isolated]
    command: [python, -m, ai_bridge.server, --host, 0.0.0.0]
    healthcheck: *worker-health
    environment:
      <<: *python-env
      # The MCP server reads each result the moment its job ends, so finished jobs need not hold capacity for the
      # default five minutes; an agent's burst of calls would otherwise fill the worker.
      BRIDGE_RETENTION_SECONDS: "30"

  # A stdio MCP server for the host's agent: `docker compose -f docker/compose.yaml run --rm -i -T mcp`.
  # It reads files only under /data, which is the checkout unless BRIDGE_MCP_DATA holds an absolute path.
  # The pinned wheels are installed into a tmpfs on every start, before the first JSON-RPC byte.
  mcp: &mcp
    <<: *python
    profiles: [mcp]
    networks: [isolated]
    depends_on:
      mcp-worker:
        condition: service_healthy
    stdin_open: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /deps:rw,exec,nosuid,size=256m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
      - ${BRIDGE_MCP_DATA:-..}:/data:ro
    environment: &mcp-env
      <<: *python-env
      PYTHONPATH: /work/mcp_server:/deps
      BRIDGE_URL: http://mcp-worker:8090
      BRIDGE_MCP_ROOT: /data
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    command:
      - sh
      - -ec
      - 'python -m pip install -q --require-hashes --no-compile --no-index --find-links=/cache/wheels --only-binary=:all: --target /deps -r requirements-mcp.lock && exec python -m bridge_mcp'

  # Operator-run index builder for bridge_search, e.g.
  # `docker compose -f docker/compose.yaml run --rm mcp-index /data/docs --out /data/artifacts/docs`.
  # The only service that can write to /data; it talks to mcp-worker over the protocol and needs no wheels.
  mcp-index: &mcp-index
    <<: *python
    profiles: [mcp]
    networks: [isolated]
    depends_on:
      mcp-worker:
        condition: service_healthy
    volumes:
      - ..:/work:ro
      - ${BRIDGE_MCP_DATA:-..}:/data
    environment: &mcp-index-env
      <<: *python-env
      PYTHONPATH: /work/mcp_server
      BRIDGE_URL: http://mcp-worker:8090
    entrypoint: [python, -m, bridge_mcp.index, build]

  # The pinned ONNX models behind the MCP server, after the `fetcher` has run once. Its worker is its own, for
  # the same reason as mcp-worker, and installs the model wheels on every start, so the health check matters most
  # here. Start with `run --rm -i -T mcp-model`.
  mcp-model-worker:
    <<: *model-worker
    profiles: [mcp-model]
    healthcheck: *worker-health
    environment:
      <<: *model-worker-env
      BRIDGE_RETENTION_SECONDS: "30"  # as for mcp-worker

  mcp-model:
    <<: *mcp
    profiles: [mcp-model]
    depends_on:
      mcp-model-worker:
        condition: service_healthy
    environment:
      <<: *mcp-env
      BRIDGE_URL: http://mcp-model-worker:8090
      # The worker runs one job at a time, so calls an agent makes together queue for its one warm child.
      BRIDGE_MCP_TIMEOUT_MS: "300000"

  # Builds an index with the models, e.g. `run --rm mcp-model-index /data/docs --out /data/artifacts/docs`. An index
  # one worker built is refused by a server whose worker embeds with another model.
  mcp-model-index:
    <<: *mcp-index
    profiles: [mcp-model]
    depends_on:
      mcp-model-worker:
        condition: service_healthy
    environment:
      <<: *mcp-index-env
      BRIDGE_URL: http://mcp-model-worker:8090

  mcp-tests:
    <<: *python
    profiles: [mcp]
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
      - /deps:rw,exec,nosuid,size=256m,uid=65532,gid=65532
    volumes:
      - ..:/work:ro
      - ../.cache:/cache:ro
    environment:
      <<: *python-env
      PYTHONPATH: /work/worker:/work/mcp_server:/deps
      # Enabled on purpose: the tests prove the test tasks are never exposed as tools.
      BRIDGE_TEST_TASKS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    command:
      - sh
      - -ec
      - 'python -m pip install -q --require-hashes --no-compile --no-index --find-links=/cache/wheels --only-binary=:all: --target /deps -r requirements-mcp.lock && python -m unittest discover -s tests/mcp -v'

networks:
  isolated:
    internal: true

volumes:
  tls-ca:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,uid=65532,gid=65532,mode=0700"
