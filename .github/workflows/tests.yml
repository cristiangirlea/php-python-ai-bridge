name: Tests

# Pushes to main and every pull request; a push to a pull request's branch would otherwise run every job twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The repository is public, so every job runs on GitHub's hosted runners, which GitHub does not meter for public
# repositories and which are disposable: a fork's pull request runs its own code on a runner that is thrown away.
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            image: dunglas/frankenphp:1.12.7-php8.2-bookworm@sha256:15646d56650cc5a6c68275ac934eab8f8648a5e776690035f9278a93e0577088
          - php: '8.3'
            image: dunglas/frankenphp:1.12.7-php8.3-bookworm@sha256:555b08c41cedd5b4358768726197a076d6c7973b9cec845bc619854f5b116663
          - php: '8.4'
            image: dunglas/frankenphp:1.12.7-php8.4-bookworm@sha256:069ddad6dd0f7d10e170d80038e247dfce1b74b36e8a2c60e4b18fe280dd2052
          - php: '8.5'
            image: dunglas/frankenphp:1.12.7-php8.5-bookworm@sha256:7380f2c24ef9d86ad496dbc285ba66e212365c864db2797f3e7269afad100dbb
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
      BRIDGE_PHP_IMAGE: ${{ matrix.image }}
      EXPECTED_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect sandbox configuration
        run: docker compose -f docker/compose.yaml --profile test config
      - name: Unit and syntax tests
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps -e EXPECTED_PHP php-tests php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED_PHP") ? 0 : 1);'
          docker compose -f docker/compose.yaml run --rm --no-deps python-tests
          docker compose -f docker/compose.yaml run --rm --no-deps php-tests
          docker compose -f docker/compose.yaml run --rm --no-deps php-tests sh -ec 'find src examples tests/php -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: HTTP and FrankenPHP integration
        run: |
          docker compose -f docker/compose.yaml up -d worker frankenphp fault-worker hostile tokens-worker
          docker compose -f docker/compose.yaml run --rm --no-deps php-integration
          docker compose -f docker/compose.yaml run --rm --no-deps integration
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile test down

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Inspect sandbox configuration
        run: docker compose -f docker/compose.yaml --profile mcp --profile mcp-fetch --profile mcp-model --profile php-dev --profile py-dev --profile php-frameworks --profile tls config
      - name: Acquire hash-pinned MCP wheels
        run: docker compose -f docker/compose.yaml run --rm --no-deps mcp-fetcher
      - name: Offline MCP server tests
        run: docker compose -f docker/compose.yaml run --rm --no-deps mcp-tests
      - name: Acquire the pinned mypy and ruff
        run: docker compose -f docker/compose.yaml run --rm --no-deps py-dev-fetcher
      # After mcp-fetcher: mypy reads the MCP SDK's types from its wheels.
      - name: mypy --strict and ruff over the Python code, offline
        run: docker compose -f docker/compose.yaml run --rm --no-deps py-analysis
      - name: Consumer Composer install of the library
        run: docker compose -f docker/compose.yaml run --rm --no-deps -e BRIDGE_REQUIRE_ARCHIVE=1 composer-install
      - name: Acquire the locked PHPStan
        run: docker compose -f docker/compose.yaml run --rm --no-deps php-fetcher
      # PHPStan reads the provider and the bundle against these, so they come before it.
      - name: Acquire the locked Laravel and Symfony
        run: docker compose -f docker/compose.yaml run --rm --no-deps php-frameworks-fetcher
      - name: PHPStan at level max, offline
        run: docker compose -f docker/compose.yaml run --rm --no-deps php-analysis
      - name: PSR-18 transport checks with the dev interfaces, offline
        run: docker compose -f docker/compose.yaml run --rm --no-deps php-psr18-tests
      # Once, on compose's default PHP 8.5: the locked Symfony 8 needs PHP 8.4 or later and Laravel 13 needs 8.3.
      - name: Laravel provider and Symfony bundle against the worker, offline
        run: |
          docker compose -f docker/compose.yaml up -d worker
          docker compose -f docker/compose.yaml run --rm --no-deps laravel-tests
          docker compose -f docker/compose.yaml run --rm --no-deps symfony-tests
      - name: The client through the TLS proxy, verified against the example CA only
        run: |
          docker compose -f docker/compose.yaml up -d tls-proxy
          docker compose -f docker/compose.yaml run --rm --no-deps tls-check
          docker compose -f docker/compose.yaml logs --no-log-prefix --no-color worker | docker compose -f docker/compose.yaml run --rm --no-deps -T tls-check php tests/php/tls.php request-log
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile mcp --profile mcp-fetch --profile php-dev --profile py-dev --profile php-frameworks --profile tls down

  # The images publish.yml pushes, built for this runner's platform only and never pushed.
  images:
    name: Worker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          push: false
          load: true
          tags: bridge-worker:ci
      - name: Build the ONNX worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker-onnx
          platforms: linux/amd64
          push: false
          load: true
          tags: bridge-worker-onnx:ci
      - name: The images start the worker
        run: |
          docker run --rm --entrypoint python bridge-worker:ci -c 'import ai_bridge.server'
          docker run --rm bridge-worker:ci --help
          docker run --rm -e ORT_DISABLE_TELEMETRY=1 --entrypoint python bridge-worker-onnx:ci -c 'import onnxruntime, tokenizers, numpy, ai_bridge.server'
          docker run --rm bridge-worker-onnx:ci --help
      # Each image serves an authenticated /healthz; the ONNX one on the lexical backend, since CI has no models.
      - name: The images answer /healthz
        timeout-minutes: 3
        env:
          BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
          PROBE: |
            import json, os, sys, time, urllib.error, urllib.request
            request = urllib.request.Request("http://127.0.0.1:8090/healthz",
                                             headers={"Authorization": "Bearer " + os.environ["BRIDGE_TOKEN"]})
            for attempt in range(30):
                try:
                    with urllib.request.urlopen(request, timeout=2) as response:
                        body = json.load(response)
                    break
                except urllib.error.HTTPError:
                    raise
                except OSError:
                    time.sleep(1)
            else:
                sys.exit("/healthz never answered")
            expected = {"status": "ok", "protocol": 1, "backend": sys.argv[1]}
            if body != expected:
                sys.exit(f"/healthz said {body}, expected {expected}")
            print(body)
        run: |
          docker run -d --name bridge-worker-ci -e BRIDGE_TOKEN bridge-worker:ci
          docker run --rm --network container:bridge-worker-ci -e BRIDGE_TOKEN --entrypoint python bridge-worker:ci \
            -c "$PROBE" lexical
          docker run -d --name bridge-worker-onnx-ci -e BRIDGE_TOKEN -e BRIDGE_BACKEND=lexical bridge-worker-onnx:ci
          docker run --rm --network container:bridge-worker-onnx-ci -e BRIDGE_TOKEN --entrypoint python \
            bridge-worker-onnx:ci -c "$PROBE" lexical
          # The fetcher takes no arguments and `fetch` downloads at once, so it is only loaded here, offline.
          docker run --rm --network none --entrypoint python bridge-worker-onnx:ci -c \
            'import importlib.util as u; s = u.spec_from_file_location("fetch_model", "/opt/bridge/fetch_model.py"); s.loader.exec_module(u.module_from_spec(s))'
      - name: Stop the image checks' containers
        if: always()
        run: docker rm -f bridge-worker-ci bridge-worker-onnx-ci || true

  # Keep the required branch-protection check stable as the matrix changes.
  deterministic:
    if: always()
    needs: [php, mcp, images]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every supported PHP version, the MCP server and the images to pass
        env:
          MATRIX_RESULT: ${{ needs.php.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: test "$MATRIX_RESULT" = success -a "$MCP_RESULT" = success -a "$IMAGES_RESULT" = success
