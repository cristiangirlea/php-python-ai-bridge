name: Real model smoke tests

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Weekly, so a change upstream (a pinned file removed, a wheel yanked) is noticed without a PR.
  # GitHub runs schedules on the default branch only and pauses them after 60 days without commits.
  schedule:
    - cron: "17 6 * * 1"
  # Any change that can alter model acquisition or inference. Not a required check: it downloads
  # model files and needs the network, which the deterministic gate deliberately does not.
  pull_request:
    paths:
      - scripts/fetch_model.py
      - requirements-model.txt
      - requirements-model.lock
      - worker/ai_bridge/tasks.py
      # The worker pool that runs every model job.
      - worker/ai_bridge/jobs.py
      # The worker's HTTP handling, which every model test and the MCP workers' health check go through.
      - worker/ai_bridge/server.py
      # Imported by both: the counters and the log lines every model job passes through.
      - worker/ai_bridge/metrics.py
      - worker/ai_bridge/log.py
      - scripts/benchmark.py
      - scripts/ner_measure.py
      - scripts/relevance_measure.py
      - tests/python/test_relevance_measure.py
      - tests/python/test_fetch_model.py
      - tests/python/test_public_data.py
      - scripts/public_data.py
      - tests/fixtures/ner-sample.json
      - tests/php/model.php
      - tests/php/model_selected.php
      - tests/model_integration.py
      # What those smoke tests run through: the shared HTTP helpers, the PHP client and the demo route.
      - tests/integration.py
      - src/**
      - examples/bootstrap.php
      - examples/frankenphp/**
      - scripts/run_frankenphp.sh
      # The MCP server with the models behind it, and the probe that drives it over stdio.
      - mcp_server/**
      - requirements-mcp.lock
      - scripts/mcp_stdio_onnx.sh
      - tests/mcp_model_probe.py
      - tests/mcp/fixtures/eval/**
      - tests/mcp/semantic_reach.py
      - tests/mcp/evaluation-semantic.xml
      - tests/model_cases.py
      - docker/compose.yaml
      - .github/workflows/model-smoke.yml
      # Audited by the audit job below, with the two Python locks above.
      - composer.lock
      - .github/audit-ignore.txt
      - .github/scripts/audit.sh

permissions:
  contents: read

# One run per event and branch: a new push cancels the old, and a scheduled run never cancels a hand-started one.
concurrency:
  group: model-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's hosted runners, as in tests.yml: the repository is public.
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Inspect acquisition and execution limits
        run: docker compose -f docker/compose.yaml --profile model-fetch --profile model --profile mcp-fetch --profile mcp-model config
      - name: Acquire hash-pinned wheels and model files
        run: docker compose -f docker/compose.yaml run --rm --no-deps fetcher
      - name: Offline model tests
        run: |
          docker compose -f docker/compose.yaml up -d model-worker model-frankenphp
          docker compose -f docker/compose.yaml run --rm --no-deps model-test
          docker compose -f docker/compose.yaml run --rm --no-deps model-integration
      - name: Selected rerankers through the PHP client
        shell: bash
        run: |
          for choice in minilm-l6 bge-base; do
            export BRIDGE_RERANK_MODEL="$choice"
            case "$choice" in
              minilm-l6) expected=Xenova/ms-marco-MiniLM-L-6-v2 ;;
              bge-base) expected=Xenova/bge-reranker-base ;;
            esac
            docker compose -f docker/compose.yaml up -d --force-recreate model-worker
            docker compose -f docker/compose.yaml run --rm --no-deps -e BRIDGE_RERANK_EXPECTED="$expected" model-test php tests/php/model_selected.php
          done
          unset BRIDGE_RERANK_MODEL
          docker compose -f docker/compose.yaml up -d --force-recreate model-worker
      # The MCP server a host starts with the models behind it, over stdio, including a search over an index the
      # embedding model built. The builder writes as the containers' UID, so the data directory is world-writable.
      - name: ONNX-backed MCP server end to end
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps mcp-fetcher
          export BRIDGE_MCP_DATA="$RUNNER_TEMP/mcp-data"
          mkdir -p "$BRIDGE_MCP_DATA"
          cp -r tests/mcp/fixtures/eval/notes tests/mcp/fixtures/eval/tasks.txt "$BRIDGE_MCP_DATA/"
          chmod -R a+rwX "$BRIDGE_MCP_DATA"
          docker compose -f docker/compose.yaml run --rm mcp-model-index /data/notes --out /data/index --chunk-chars 300 --overlap-chars 60
          python3 tests/mcp_model_probe.py
      # Times never gate: the benchmark asserts nothing about speed. Its jobs must succeed, including the
      # worst-case batch, so bash's pipefail keeps tee from hiding a failure.
      - name: Latency benchmark (times informational, correctness gating)
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: GitHub-hosted ubuntu-latest
        run: |
          # The model tests above have warmed the model worker; restart it so the benchmark's first job is cold.
          docker compose -f docker/compose.yaml restart model-worker
          docker compose -f docker/compose.yaml up -d worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-bench | tee benchmark.md
          { echo "## Measured latency (informational)"; echo; cat benchmark.md; } >> "$GITHUB_STEP_SUMMARY"
      # Scores never gate either: the sample is small and invented. Every job must succeed with spans inside its text.
      - name: NER precision and recall (informational, correctness gating)
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: GitHub-hosted ubuntu-latest
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-ner | tee ner.md
          { echo "## NER precision and recall (informational)"; echo; cat ner.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --profile model --profile mcp-model logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model --profile mcp-model down

  # Public, hash-pinned quality figures on demand and at release, with SQuAD as the release threshold.
  quality:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
      # Each result is read as its job ends, so a short retention keeps the jobs inside the worker's capacity.
      BRIDGE_MODEL_RETENTION_SECONDS: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Acquire hash-pinned wheels, model files and datasets
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps fetcher
          docker compose -f docker/compose.yaml run --rm --no-deps quality-fetcher
      - name: Reranking and NER quality on public data (informational, correctness gating)
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: GitHub-hosted ubuntu-latest
        run: |
          docker compose -f docker/compose.yaml up -d model-worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-quality | tee quality.md
          { echo "## Quality on public datasets (informational)"; echo; cat quality.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: SQuAD release quality gate
        shell: bash
        env:
          RELEVANCE_DATASET: squad
          RELEVANCE_GATE: "1"
        run: docker compose -f docker/compose.yaml run --rm --no-deps -T model-quality python scripts/relevance_measure.py
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --profile model logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model down

  # A hash pin keeps a package from changing, not from turning out vulnerable; this asks the advisory databases.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script reads .github/audit-ignore.txt and runs every scanner before it fails; its tests use stub scanners.
      - name: Audit the Python and PHP locks
        run: sh .github/scripts/audit.sh

  # On demand only, about 45 minutes: throughput and latency under load. Informational; no figure gates anything.
  load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
      BENCH_COMMIT: ${{ github.sha }}
      BENCH_RUNNER: GitHub-hosted ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Acquire hash-pinned wheels and model files
        run: docker compose -f docker/compose.yaml run --rm --no-deps fetcher
      - name: Lexical worker under load (informational)
        shell: bash
        env:
          LOAD_TARGET: lexical
          LOAD_CONCURRENCY: "1,4,16"
          LOAD_SECONDS: "120"
        run: |
          docker compose -f docker/compose.yaml up -d worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-load | tee load-lexical.md
          { echo "## Lexical worker under load (informational)"; echo; cat load-lexical.md; echo; } >> "$GITHUB_STEP_SUMMARY"
      # The memory figures are read after the soak: docker stats at that moment, and the cgroup's peak over the run.
      - name: ONNX worker soak (informational)
        shell: bash
        env:
          LOAD_TARGET: onnx
          LOAD_CONCURRENCY: "1,4"
          LOAD_SECONDS: "600"
        run: |
          docker compose -f docker/compose.yaml up -d model-worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-load | tee load-onnx.md
          worker="$(docker compose -f docker/compose.yaml ps -q model-worker)"
          {
            echo "## ONNX worker soak (informational)"; echo; cat load-onnx.md; echo
            echo "docker stats after the soak: $(docker stats --no-stream --format '{{.MemUsage}}' "$worker")"
            echo "cgroup memory.peak: $(docker exec "$worker" cat /sys/fs/cgroup/memory.peak) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --profile model logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model down
