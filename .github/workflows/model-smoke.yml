name: Real model smoke tests

on:
  workflow_dispatch:
  # Weekly, so a change upstream (a pinned file removed, a wheel yanked) is noticed without a PR.
  # GitHub runs schedules on the default branch only and pauses them after 60 days without commits.
  schedule:
    - cron: "17 6 * * 1"
  # Any change that can alter model acquisition or inference. Not a required check: it downloads
  # about 215 MB and needs the network, which the deterministic gate deliberately does not.
  pull_request:
    paths:
      - scripts/fetch_model.py
      - requirements-model.txt
      - requirements-model.lock
      - worker/ai_bridge/tasks.py
      - scripts/benchmark.py
      - tests/php/model.php
      - tests/model_integration.py
      # What those smoke tests run through: the shared HTTP helpers, the PHP client and the demo route.
      - tests/integration.py
      - src/**
      - examples/bootstrap.php
      - examples/frankenphp/**
      - scripts/run_frankenphp.sh
      - docker/compose.yaml
      - .github/workflows/model-smoke.yml

permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete; do not download the models twice.
concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Inspect acquisition and execution limits
        run: docker compose -f docker/compose.yaml --profile model-fetch --profile model config
      - name: Acquire hash-pinned wheels and model files
        run: docker compose -f docker/compose.yaml run --rm --no-deps fetcher
      - name: Offline model tests
        run: |
          docker compose -f docker/compose.yaml up -d model-worker model-frankenphp
          docker compose -f docker/compose.yaml run --rm --no-deps model-test
          docker compose -f docker/compose.yaml run --rm --no-deps model-integration
      - name: Latency benchmark (informational, never gating)
        continue-on-error: true
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: GitHub-hosted ubuntu-latest
        run: |
          docker compose -f docker/compose.yaml up -d worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-bench | tee benchmark.md
          { echo "## Measured latency (informational)"; echo; cat benchmark.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --profile model logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model down
