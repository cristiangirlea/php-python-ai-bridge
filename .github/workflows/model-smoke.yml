name: Real model smoke tests

on:
  workflow_dispatch:
  # Weekly, so a change upstream (a pinned file removed, a wheel yanked) is noticed without a PR.
  # GitHub runs schedules on the default branch only and pauses them after 60 days without commits.
  schedule:
    - cron: "17 6 * * 1"
  # Any change that can alter model acquisition or inference. Not a required check: it downloads
  # about 330 MB and needs the network, which the deterministic gate deliberately does not.
  pull_request:
    paths:
      - scripts/fetch_model.py
      - requirements-model.txt
      - requirements-model.lock
      - worker/ai_bridge/tasks.py
      # The worker's HTTP handling, which every model test and the MCP workers' health check go through.
      - worker/ai_bridge/server.py
      - scripts/benchmark.py
      - scripts/ner_measure.py
      - tests/fixtures/ner-sample.json
      - tests/php/model.php
      - tests/model_integration.py
      # What those smoke tests run through: the shared HTTP helpers, the PHP client and the demo route.
      - tests/integration.py
      - src/**
      - examples/bootstrap.php
      - examples/frankenphp/**
      - scripts/run_frankenphp.sh
      # The MCP server with the models behind it, and the probe that drives it over stdio.
      - mcp_server/**
      - requirements-mcp.lock
      - scripts/mcp_stdio_onnx.sh
      - tests/mcp_model_probe.py
      - tests/mcp/fixtures/eval/**
      - tests/mcp/semantic_reach.py
      - tests/mcp/evaluation-semantic.xml
      - tests/model_cases.py
      - docker/compose.yaml
      - .github/workflows/model-smoke.yml
      - .github/actions/compose/**

permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete; do not download the models twice.
concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: true

# The lab's self-hosted runner scale set that the CI_RUNNER repository variable names, or GitHub's when it is unset.
# As written here, a fork's pull request goes to GitHub's disposable runners; a fork can edit this file, so the fork
# approval policy is what keeps its code off the lab's runner (docs/security.md).
jobs:
  model:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/compose
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Inspect acquisition and execution limits
        run: docker compose -f docker/compose.yaml --profile model-fetch --profile model --profile mcp-fetch --profile mcp-model config
      - name: Acquire hash-pinned wheels and model files
        run: docker compose -f docker/compose.yaml run --rm --no-deps fetcher
      - name: Offline model tests
        run: |
          docker compose -f docker/compose.yaml up -d model-worker model-frankenphp
          docker compose -f docker/compose.yaml run --rm --no-deps model-test
          docker compose -f docker/compose.yaml run --rm --no-deps model-integration
      # The MCP server a host starts with the models behind it, over stdio, including a search over an index the
      # embedding model built. The builder writes as the containers' UID, so the data directory is world-writable.
      - name: ONNX-backed MCP server end to end
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps mcp-fetcher
          export BRIDGE_MCP_DATA="$RUNNER_TEMP/mcp-data"
          mkdir -p "$BRIDGE_MCP_DATA"
          cp -r tests/mcp/fixtures/eval/notes tests/mcp/fixtures/eval/tasks.txt "$BRIDGE_MCP_DATA/"
          chmod -R a+rwX "$BRIDGE_MCP_DATA"
          docker compose -f docker/compose.yaml run --rm mcp-model-index /data/notes --out /data/index --chunk-chars 300 --overlap-chars 60
          python3 tests/mcp_model_probe.py
      # Times never gate: the benchmark asserts nothing about speed. Its jobs must succeed, including the
      # worst-case batch, so bash's pipefail keeps tee from hiding a failure.
      - name: Latency benchmark (times informational, correctness gating)
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: ${{ runner.environment == 'self-hosted' && format('self-hosted {0}', vars.CI_RUNNER) || 'GitHub-hosted ubuntu-latest' }}
        run: |
          docker compose -f docker/compose.yaml up -d worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-bench | tee benchmark.md
          { echo "## Measured latency (informational)"; echo; cat benchmark.md; } >> "$GITHUB_STEP_SUMMARY"
      # Scores never gate either: the sample is small and invented. Every job must succeed with spans inside its text.
      - name: NER precision and recall (informational, correctness gating)
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_RUNNER: ${{ runner.environment == 'self-hosted' && format('self-hosted {0}', vars.CI_RUNNER) || 'GitHub-hosted ubuntu-latest' }}
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-ner | tee ner.md
          { echo "## NER precision and recall (informational)"; echo; cat ner.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --profile model --profile mcp-model logs --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model --profile mcp-model down
