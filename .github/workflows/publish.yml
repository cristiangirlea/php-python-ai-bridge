name: Publish images

# Manual branch runs skip the quality gate and publishing; version tags publish only after the gate passes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# GitHub's hosted runners, as in tests.yml: the repository is public, and no step here needs more than the job's own
# token.
jobs:
  build-amd64:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      worker: ${{ steps.worker.outputs.digest }}
      onnx: ${{ steps.onnx.outputs.digest }}
    env:
      IMAGE: ghcr.io/cristiangirlea/php-python-ai-bridge-worker
      # Build records use Actions artifact storage even without an explicit upload step.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Run this on a v* tag, not $GITHUB_REF" >&2; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Build and push the ONNX worker image
        id: onnx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker-onnx
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }}-onnx,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Pull the pushed images
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
        run: |
          docker pull "$IMAGE@$WORKER_DIGEST"
          docker pull "$IMAGE-onnx@$ONNX_DIGEST"
      - name: The images start the worker
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "$IMAGE@$WORKER_DIGEST" -c 'import ai_bridge.server'
          docker run --rm "$IMAGE@$WORKER_DIGEST" --help
          docker run --rm -e ORT_DISABLE_TELEMETRY=1 --entrypoint python "$IMAGE-onnx@$ONNX_DIGEST" -c 'import onnxruntime, tokenizers, numpy, ai_bridge.server'
          docker run --rm "$IMAGE-onnx@$ONNX_DIGEST" --help
      # Each image serves an authenticated /healthz; the ONNX one on the lexical backend, since CI has no models.
      - name: The images answer /healthz
        timeout-minutes: 3
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
          BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
          PROBE: |
            import json, os, sys, time, urllib.error, urllib.request
            request = urllib.request.Request("http://127.0.0.1:8090/healthz",
                                             headers={"Authorization": "Bearer " + os.environ["BRIDGE_TOKEN"]})
            for attempt in range(30):
                try:
                    with urllib.request.urlopen(request, timeout=2) as response:
                        body = json.load(response)
                    break
                except urllib.error.HTTPError:
                    raise
                except OSError:
                    time.sleep(1)
            else:
                sys.exit("/healthz never answered")
            expected = {"status": "ok", "protocol": 1, "backend": sys.argv[1]}
            if body != expected:
                sys.exit(f"/healthz said {body}, expected {expected}")
            print(body)
        run: |
          docker run -d --name bridge-worker-ci -e BRIDGE_TOKEN "$IMAGE@$WORKER_DIGEST"
          docker run --rm --network container:bridge-worker-ci -e BRIDGE_TOKEN --entrypoint python "$IMAGE@$WORKER_DIGEST" \
            -c "$PROBE" lexical
          docker run -d --name bridge-worker-onnx-ci -e BRIDGE_TOKEN -e BRIDGE_BACKEND=lexical "$IMAGE-onnx@$ONNX_DIGEST"
          docker run --rm --network container:bridge-worker-onnx-ci -e BRIDGE_TOKEN --entrypoint python \
            "$IMAGE-onnx@$ONNX_DIGEST" -c "$PROBE" lexical
          # The fetcher takes no arguments and `fetch` downloads at once, so it is only loaded here, offline.
          docker run --rm --network none --entrypoint python "$IMAGE-onnx@$ONNX_DIGEST" -c \
            'import importlib.util as u; s = u.spec_from_file_location("fetch_model", "/opt/bridge/fetch_model.py"); s.loader.exec_module(u.module_from_spec(s))'
      - name: Stop the image checks' containers
        if: always()
        run: docker rm -f bridge-worker-ci bridge-worker-onnx-ci || true

  build-arm64:
    needs: [quality]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      worker: ${{ steps.worker.outputs.digest }}
      onnx: ${{ steps.onnx.outputs.digest }}
    env:
      IMAGE: ghcr.io/cristiangirlea/php-python-ai-bridge-worker
      # Build records use Actions artifact storage even without an explicit upload step.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Run this on a v* tag, not $GITHUB_REF" >&2; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Build and push the ONNX worker image
        id: onnx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.worker-onnx
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }}-onnx,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Pull the pushed images
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
        run: |
          docker pull "$IMAGE@$WORKER_DIGEST"
          docker pull "$IMAGE-onnx@$ONNX_DIGEST"
      - name: The images start the worker
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "$IMAGE@$WORKER_DIGEST" -c 'import ai_bridge.server'
          docker run --rm "$IMAGE@$WORKER_DIGEST" --help
          docker run --rm -e ORT_DISABLE_TELEMETRY=1 --entrypoint python "$IMAGE-onnx@$ONNX_DIGEST" -c 'import onnxruntime, tokenizers, numpy, ai_bridge.server'
          docker run --rm "$IMAGE-onnx@$ONNX_DIGEST" --help
      # Each image serves an authenticated /healthz; the ONNX one on the lexical backend, since CI has no models.
      - name: The images answer /healthz
        timeout-minutes: 3
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ONNX_DIGEST: ${{ steps.onnx.outputs.digest }}
          BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
          PROBE: |
            import json, os, sys, time, urllib.error, urllib.request
            request = urllib.request.Request("http://127.0.0.1:8090/healthz",
                                             headers={"Authorization": "Bearer " + os.environ["BRIDGE_TOKEN"]})
            for attempt in range(30):
                try:
                    with urllib.request.urlopen(request, timeout=2) as response:
                        body = json.load(response)
                    break
                except urllib.error.HTTPError:
                    raise
                except OSError:
                    time.sleep(1)
            else:
                sys.exit("/healthz never answered")
            expected = {"status": "ok", "protocol": 1, "backend": sys.argv[1]}
            if body != expected:
                sys.exit(f"/healthz said {body}, expected {expected}")
            print(body)
        run: |
          docker run -d --name bridge-worker-ci -e BRIDGE_TOKEN "$IMAGE@$WORKER_DIGEST"
          docker run --rm --network container:bridge-worker-ci -e BRIDGE_TOKEN --entrypoint python "$IMAGE@$WORKER_DIGEST" \
            -c "$PROBE" lexical
          docker run -d --name bridge-worker-onnx-ci -e BRIDGE_TOKEN -e BRIDGE_BACKEND=lexical "$IMAGE-onnx@$ONNX_DIGEST"
          docker run --rm --network container:bridge-worker-onnx-ci -e BRIDGE_TOKEN --entrypoint python \
            "$IMAGE-onnx@$ONNX_DIGEST" -c "$PROBE" lexical
          # The fetcher takes no arguments and `fetch` downloads at once, so it is only loaded here, offline.
          docker run --rm --network none --entrypoint python "$IMAGE-onnx@$ONNX_DIGEST" -c \
            'import importlib.util as u; s = u.spec_from_file_location("fetch_model", "/opt/bridge/fetch_model.py"); s.loader.exec_module(u.module_from_spec(s))'
      - name: Stop the image checks' containers
        if: always()
        run: docker rm -f bridge-worker-ci bridge-worker-onnx-ci || true

  publish:
    needs: [quality, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/cristiangirlea/php-python-ai-bridge-worker
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require a version tag
        id: version
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Run this on a v* tag, not $GITHUB_REF" >&2; exit 1 ;; esac
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (v1.2.0-rc.1) gets its version tag only; latest stays on the last release.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"
                 printf 'worker=%s\nonnx=%s\n' "$IMAGE:$version" "$IMAGE-onnx:$version" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"
                 printf 'worker=%s\nonnx=%s\n' "$IMAGE:$version,$IMAGE:latest" "$IMAGE-onnx:$version,$IMAGE-onnx:latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested worker images
        id: worker
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.worker }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.worker }}
          TAGS: ${{ steps.version.outputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid AMD64 digest" >&2; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid ARM64 digest" >&2; exit 1; }
          IFS=',' read -ra names <<< "$TAGS"
          tags=()
          for tag in "${names[@]}"; do tags+=(-t "$tag"); done
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid index digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true
      - name: Tag the tested ONNX worker images
        id: onnx
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.onnx }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.onnx }}
          TAGS: ${{ steps.version.outputs.onnx }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid AMD64 digest" >&2; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid ARM64 digest" >&2; exit 1; }
          IFS=',' read -ra names <<< "$TAGS"
          tags=()
          for tag in "${names[@]}"; do tags+=(-t "$tag"); done
          docker buildx imagetools create "${tags[@]}" "$IMAGE-onnx@$AMD64_DIGEST" "$IMAGE-onnx@$ARM64_DIGEST"
          digest=$(docker buildx imagetools inspect "$IMAGE-onnx:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid index digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}-onnx
          subject-digest: ${{ steps.onnx.outputs.digest }}
          push-to-registry: true
      # The archive is what Composer installs: .gitattributes leaves the worker, Docker and test files out of it.
      - name: Build the source archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="php-python-ai-bridge-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="php-python-ai-bridge-$VERSION/" -o "$archive" "$GITHUB_SHA"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest the source archive
        id: archive-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Attach the source archive and attestation to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          BUNDLE: ${{ steps.archive-attestation.outputs.bundle-path }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cp "$BUNDLE" "$ARCHIVE.sigstore.json"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=""
            if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
            gh release create "$TAG" --verify-tag --notes-from-tag --title "$TAG" $flags
          fi
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sigstore.json" --clobber

  # Publishing must wait for this tag's default reranker to meet the question-to-passage quality floor.
  quality:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BRIDGE_TOKEN: test-only-bridge-token-never-use-in-production
      BRIDGE_MODEL_RETENTION_SECONDS: "15"
      RELEVANCE_DATASET: squad
      RELEVANCE_GATE: "1"
      BENCH_COMMIT: ${{ github.sha }}
      BENCH_RUNNER: GitHub-hosted ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare disposable cache
        run: mkdir -p .cache && chmod 777 .cache
      - name: Acquire pinned models and datasets
        run: |
          docker compose -f docker/compose.yaml run --rm --no-deps fetcher
          docker compose -f docker/compose.yaml run --rm --no-deps quality-fetcher
      - name: Require default reranker NDCG at least BM25
        shell: bash
        run: |
          docker compose -f docker/compose.yaml up -d model-worker
          docker compose -f docker/compose.yaml run --rm --no-deps -T model-quality python scripts/relevance_measure.py
      - name: Stop gate containers
        if: always()
        run: docker compose -f docker/compose.yaml --profile model down
