name: CodeQL

# Weekly as well as on changes, so new queries reach code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read
  security-events: write

# CodeQL does not support PHP; PHPStan and hostile-peer tests cover the client in tests.yml.
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python, actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
