# Keep the workflows' commit-pinned actions and version comments current through pull requests that still go through CI and review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The hash-pinned wheel sets (requirements-model.*, requirements-mcp.*) are only safe while someone is told they aged.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  # composer.lock pins the dev tools and PSR interfaces CI installs; the library itself requires only PHP extensions.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
